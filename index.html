*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f4f6f8;color:#111827}
header{background:#111827;color:white;padding:18px 16px 16px;position:sticky;top:0;z-index:10}
h1{font-size:22px;margin:0 0 4px} .sub{opacity:.78;font-size:13px}
.wrap{max-width:760px;margin:auto;padding:14px}
.hero{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
.hero h2{margin:0 0 4px;font-size:20px} .todaydate{color:#6b7280;font-size:13px}
.statrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{background:#eef2ff;padding:7px 10px;border-radius:999px;font-size:12px}
.tabs{display:flex;gap:8px;margin:12px 0}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:650;background:#e5e7eb;color:#111827}
button.active{background:#111827;color:white}
.search{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:12px;font-size:15px;margin-bottom:12px}
.day{background:white;border-radius:16px;margin:10px 0;padding:14px;box-shadow:0 2px 8px #0000000a}
.day.today{outline:2px solid #111827}
.dayhead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.daytitle{font-weight:750} .date{font-size:12px;color:#6b7280;margin-top:2px}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2ff}
.badge.holiday{background:#fee2e2;color:#991b1b}
.doctor{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #f0f1f3}
.doctor:first-child{margin-top:8px}
.check{width:19px;height:19px;flex:0 0 auto;margin-top:1px}
.name{font-weight:650;font-size:14px} .hosp{font-size:12px;color:#6b7280;margin-top:2px}
.group{margin-top:10px} .grouphead{font-size:12px;font-weight:750;color:#374151;margin-bottom:3px}
.empty{padding:14px;text-align:center;color:#6b7280}
.note{font-size:12px;color:#6b7280;margin:14px 2px}
</style>

function isoToday(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function key(day,name){return 'workplan:'+day+':'+name;}
function checked(day,name){return localStorage.getItem(key(day,name))==='1';}
function toggle(day,name,el){localStorage.setItem(key(day,name),el.checked?'1':'0'); render();}
function currentDay(){
  const t=isoToday();
  return DAYS.find(x=>x.date===t) || null;
}
function groups(day){
  const m={};
  day.doctors.forEach(d=>{(m[d.hospital||'Other']??=[]).push(d);});
  return m;
}
function dayCard(day,isToday=false){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const docs=day.doctors.filter(d=>(d.name+' '+d.hospital).toLowerCase().includes(q));
  let html=`<section class="day ${isToday?'today':''}"><div class="dayhead">
    <div><div class="daytitle">Day ${day.day} • ${esc(day.weekday)}</div><div class="date">${esc(day.date_label)}</div></div>
    <span class="badge ${day.holiday?'holiday':''}">${day.holiday?'HOLIDAY':day.doctors.length+' doctors'}</span>
  </div>`;
  if(day.holiday) return html+`<div class="empty">No visits scheduled.</div></section>`;
  if(!docs.length) return html+`<div class="empty">No matching doctors.</div></section>`;
  const g={};
  docs.forEach(d=>{(g[d.hospital||'Other']??=[]).push(d);});
  for(const [h,arr] of Object.entries(g)){
    html+=`<div class="group"><div class="grouphead">${esc(h)} • ${arr.length}</div>`;
    for(const d of arr){
      const c=checked(day.day,d.name);
      html+=`<label class="doctor"><input class="check" type="checkbox" ${c?'checked':''} onchange="toggle(${day.day},${JSON.stringify(d.name)},this)">
      <div><div class="name">${esc(d.name)}</div><div class="hosp">${esc(d.hospital)}</div></div></label>`;
    }
    html+='</div>';
  }
  return html+'</section>';
}
function renderHero(){
  const t=currentDay();
  const el=document.getElementById('todayHero');
  if(!t){
    el.innerHTML='<h2>Today</h2><div class="todaydate">No day in this 25-day plan matches today.</div>';
    return;
  }
  const done=t.doctors.filter(d=>checked(t.day,d.name)).length;
  el.innerHTML=`<h2>Today: Day ${t.day} • ${esc(t.weekday)}</h2>
    <div class="todaydate">${esc(t.date_label)}</div>
    <div class="statrow"><span class="pill">${t.holiday?'Holiday':t.doctors.length+' doctors'}</span>
    ${!t.holiday?`<span class="pill">${done} / ${t.doctors.length} completed</span>`:''}</div>`;
}
function render(){
  renderHero();
  const c=document.getElementById('content');
  if(mode==='today'){
    const t=currentDay();
    c.innerHTML=t?dayCard(t,true):'<div class="day empty">Today is outside this 25-day plan. Open <b>All Days</b> to view the complete schedule.</div>';
  }else{
    c.innerHTML=DAYS.map(d=>dayCard(d,d.date===isoToday())).join('');
  }
}
function showMode(m){
  mode=m;
  document.getElementById('todayBtn').classList.toggle('active',m==='today');
  document.getElementById('allBtn').classList.toggle('active',m==='all');
  document.getElementById('search').value='';
  render();
}
render();
